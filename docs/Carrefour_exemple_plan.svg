<svg xmlns="http://www.w3.org/2000/svg" width="988" height="547" viewBox="0 0 988 547" font-family="Arial, sans-serif">
  <!-- Repère du croquis de Thierry (988 × 547) : les flèches des groupes y sont placées en %. -->
  <rect width="988" height="547" fill="#d7d9cf"/>
  <!-- Chaussées, bords repris des traits du croquis et prolongés jusqu'au cadre -->
  <g fill="#5b5f63">
    <polygon points="0,213 209,211 371,204 687,197 833,195 988,190 988,342 365,346 205,345 0,348"/>
    <polygon points="209,0 366,0 371,206 209,213"/>                 <!-- branche nord, carrefour ouest -->
    <polygon points="205,344 366,344 368,547 206,547"/>             <!-- branche sud, carrefour ouest -->
    <polygon points="671,0 812,0 833,197 687,199"/>                 <!-- branche nord oblique, carrefour est -->
  </g>
  <!-- Voies bus (rouge brique, comme le TD) -->
  <g fill="#b5523b">
    <polygon points="878,193 988,190 988,244 878,247"/>              <!-- bus vers l'ouest, voie nord, branche est -->
    <polygon points="405,276 687,273 687,346 405,346"/>              <!-- bus vers l'est, à contresens, entre les carrefours -->
    <polygon points="878,291 988,290 988,342 878,343"/>              <!-- bus vers l'est, branche est -->
  </g>
  <g fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="945" y="224">BUS</text>
    <text x="540" y="316">BUS</text>
    <text x="940" y="322">BUS</text>
  </g>
  <!-- Séparations de voies -->
  <g stroke="#fff" stroke-width="3" fill="none">
    <line x1="405" y1="276" x2="687" y2="273"/>                        <!-- séparation sens / voie bus à contresens -->
    <line x1="878" y1="291" x2="988" y2="290"/>
    <line x1="878" y1="247" x2="988" y2="244" stroke-dasharray="14 10"/>
    <line x1="292" y1="0" x2="294" y2="160" stroke-dasharray="18 14"/>  <!-- axe branche nord ouest -->
    <line x1="287" y1="400" x2="288" y2="547" stroke-dasharray="18 14"/><!-- axe branche sud ouest -->
  </g>
  <!-- Bande cyclable traversant le carrefour ouest -->
  <g>
    <polygon points="209,212 371,205 371,238 209,245" fill="#4f8a4b" opacity="0.85"/>
    <polyline points="209,245 371,238" stroke="#fff" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  </g>
  <!-- Passages piétons -->
  <g fill="#fff">
    <!-- branche ouest (x ≈ 179) -->
    <g transform="translate(166 0)"><rect y="220" width="28" height="12"/><rect y="243" width="28" height="12"/><rect y="266" width="28" height="12"/><rect y="289" width="28" height="12"/><rect y="312" width="28" height="12"/><rect y="333" width="28" height="10"/></g>
    <!-- entre les deux carrefours (x ≈ 385) -->
    <g transform="translate(375 0)"><rect y="214" width="28" height="12"/><rect y="237" width="28" height="12"/><rect y="260" width="28" height="12"/><rect y="283" width="28" height="12"/><rect y="306" width="28" height="12"/><rect y="329" width="28" height="12"/></g>
    <!-- branche est (x ≈ 845) -->
    <g transform="translate(838 0)"><rect y="202" width="28" height="12"/><rect y="225" width="28" height="12"/><rect y="248" width="28" height="12"/><rect y="271" width="28" height="12"/><rect y="294" width="28" height="12"/><rect y="317" width="28" height="12"/></g>
    <!-- branche sud ouest (y ≈ 355) -->
    <g transform="translate(0 352)"><rect x="214" width="12" height="28"/><rect x="237" width="12" height="28"/><rect x="260" width="12" height="28"/><rect x="283" width="12" height="28"/><rect x="306" width="12" height="28"/><rect x="329" width="12" height="28"/><rect x="350" width="11" height="28"/></g>
    <!-- branche nord est, oblique (y ≈ 180) -->
    <g transform="translate(0 160) rotate(6 760 20)"><rect x="687" width="12" height="28"/><rect x="709" width="12" height="28"/><rect x="731" width="12" height="28"/><rect x="753" width="12" height="28"/><rect x="775" width="12" height="28"/><rect x="797" width="12" height="28"/><rect x="817" width="9" height="28"/></g>
  </g>
  <!-- Lignes d'arrêt -->
  <g stroke="#fff" stroke-width="5">
    <line x1="415" y1="206" x2="415" y2="276"/>   <!-- GF1, vers l'ouest -->
    <line x1="209" y1="190" x2="293" y2="190"/>   <!-- GF2, branche nord ouest -->
    <line x1="287" y1="392" x2="367" y2="392"/>   <!-- GF3, branche sud ouest -->
    <line x1="683" y1="136" x2="826" y2="151"/>   <!-- GF8, branche nord est (sens unique) -->
    <line x1="878" y1="193" x2="878" y2="291"/>   <!-- GF9 / GF10, vers l'ouest -->
    <line x1="668" y1="273" x2="668" y2="344"/>   <!-- GF11, bus vers l'est -->
  </g>
  <text x="978" y="534" font-size="13" fill="#555" text-anchor="end">Carrefour exemple — TraCflux</text>
</svg>
