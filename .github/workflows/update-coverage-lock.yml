name: Mise à jour temporaire du verrou de dépendances

on:
  push:
    branches: ['test/coverage-hardening']
    paths:
      - package.json
      - .github/workflows/update-coverage-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/update-coverage-lock.yml
          git commit -m "chore: mettre à jour le verrou de dépendances"
          git push
