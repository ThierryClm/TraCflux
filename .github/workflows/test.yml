name: Tests

# Exécute la suite Vitest + le build Vite sur chaque push et chaque PR
# vers master. Bloque les régressions silencieuses dans la logique métier
# (matrice des interverts, conflits, micro-régulation, simulation, etc.).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vérification de types en JSDoc (cf. tsconfig.json). Ne concerne que les
      # fichiers portant `// @ts-check` : le modèle de données et les modules
      # qui le manipulent. Un écart entre les types et le code s'arrête ici,
      # plutôt que d'être découvert sur un projet d'utilisateur.
      - name: Type check (JSDoc)
        run: npm run types

      - name: Run Vitest suite
        run: npm test -- --run

      - name: Production build (smoke check)
        run: npm run build
