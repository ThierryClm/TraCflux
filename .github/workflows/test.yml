name: Tests

# Exécute la suite Vitest avec son seuil de couverture + le build Vite sur
# chaque push et chaque PR vers master. Bloque les régressions silencieuses
# dans la logique métier (matrice des interverts, conflits, micro-régulation,
# simulation, authentification locale, persistance, etc.).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vérification de types en JSDoc (cf. tsconfig.json). Ne concerne que les
      # fichiers portant `// @ts-check` : le modèle de données et les modules
      # qui le manipulent. Un écart entre les types et le code s'arrête ici,
      # plutôt que d'être découvert sur un projet d'utilisateur.
      - name: Type check (JSDoc)
        run: npm run types

      # Oxlint plutôt qu'ESLint : typescript-eslint ne prend pas encore en
      # charge TypeScript 7. Les erreurs bloquent, les avertissements
      # (dépendances des hooks, règles du React Compiler) restent à résorber.
      - name: Lint (Oxlint)
        run: npm run lint

      - name: Run Vitest suite with coverage guard
        run: npm run test:coverage

      - name: Production build (smoke check)
        run: npm run build

  # Parcours réels dans Chrome, Edge, Firefox, Safari (WebKit) et Brave, sur la version
  # compilée : ouvrir et sauvegarder, projet exemple et restauration,
  # couleurs de la matrice, ajout de condition, dossier imprimé. Chaque
  # régression trouvée à l'usage y devient un cas (cf. e2e/).
  parcours:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium msedge firefox webkit

      # Brave, depuis le dépôt officiel de Brave (Playwright ne le fournit pas).
      - name: Navigateur Brave
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update
          sudo apt-get install -y brave-browser
          echo "BRAVE_PATH=$(command -v brave-browser)" >> "$GITHUB_ENV"

      - name: Parcours (Playwright)
        run: npm run e2e

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-parcours
          path: |
            playwright-report/
            test-results/
          retention-days: 7
